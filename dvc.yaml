stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/raw
  preprocess:
    cmd: python src/preprocess.py
    deps:
      - data/raw
      - src/preprocess.py
    params:
      - preprocess.seed
      - preprocess.val_size
    outs:
      - data/processed
  train:
    cmd: python src/train.py
    deps:
      - data/processed
      - src/train.py
    params:
      - train.batch_size
      - train.dense_units
      - train.dropout_rate
      - train.epochs
      - train.learning_rate
    outs:
      - models/history.csv
      - models/model.h5
  evaluate:
    cmd: python src/evaluate.py
    deps:
      - data/processed
      - models/model.h5
      - src/evaluate.py
    metrics:
      - metrics.json:
          cache: false
    outs:
      - models/confusion_matrix.png
